# -Denv=dev -Dapollo.cluster=DEFAULT -Dserver.port=53010
app:
  id: xfjr-gateway
apollo:
  meta: http://192.168.20.88:28080
  bootstrap:
    enabled: true
    namespaces: application,micro_service.spring-boot-http,micro_service.spring-eureka,micro_service.spring-boot-redis

spring:
  application:
    name: xfjr-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:53020/oauth2/jwks

# 令牌黑名单校验（FR-130 AC1：已吊销令牌返回 401，不转发下游）
gateway:
  token-blacklist:
    enabled: true

