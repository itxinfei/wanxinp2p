# 统一认证
app:
  id: xfjr-uaa
xfjr:
  jwt:
    # JWT 签名密钥文件（JWK JSON，含私钥）；不存在时首次启动自动生成。生产环境建议由 Apollo/KMS 注入专用路径
    key-path: ${user.home}/.xfjr/jwt-signing-key.json
apollo:
  meta: http://192.168.20.88:28080
  bootstrap:
    enabled: true #启动阶段注入配置
    #    eagerLoad:
    #      enabled: true
    # 使用那些命名空间中的配置项
    namespaces: application,micro_service.spring-boot-druid,micro_service.spring-boot-http,micro_service.spring-eureka,micro_service.spring-cloud-feign
spring:
  application:
    name: xfjr-uaa
  main:
    allow-bean-definition-overriding: true
