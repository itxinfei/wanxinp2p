app:
  id: xfjr-transaction
apollo:
  meta: http://192.168.20.88:28080
  bootstrap:
    enabled: true
    #    eagerLoad:
    #      enabled: true
    namespaces: application,micro_service.spring-boot-http,micro_service.spring-eureka,micro_service.spring-cloud-feign,micro_service.mybatis-plus,micro_service.spring-rocketmq
spring:
  application:
    name: xfjr-transaction
  security:
    oauth2:
      resourceserver:
        jwt:
          # 本地校验 JWT 的公钥地址（FR-130）；生产由 Apollo 覆盖
          jwk-set-uri: http://localhost:53020/oauth2/jwks
  main:
    allow-bean-definition-overriding: true
# 服务间内部调用（客户端凭证，FR-130 AC5）；client-secret 只由 Apollo/环境变量注入，勿写死
xfjr:
  internal-client:
    enabled: false
    token-uri: http://localhost:53020/oauth2/token
    client-id: xfjr-internal
    client-secret: ${INTERNAL_CLIENT_SECRET:}
  # 交易库分片（I-07 / DR-02）：默认关闭，走 Apollo 下发的单库数据源。
  # 开启后按 CONSUMER_ID % 2 路由到 p2p_transaction_0/1（表 project/tender/claim 各 _0/_1），
  # 连接信息复用 spring.datasource.*；启用前须完成 Seata 联调与分片库 undo_log 验证，见 docs/重构规划文档.md 专题四。
  sharding:
    enabled: false
# 日志配置-会代替springboot原生日志颜色
logging:
  config: classpath:log4j2-dev.xml




