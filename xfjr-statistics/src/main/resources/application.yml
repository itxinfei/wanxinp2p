server:
  port: 53080
app:
  id: xfjr-statistics
apollo:
  meta: http://192.168.20.88:28080
  bootstrap:
    enabled: true
    namespaces: application,micro_service.spring-boot-druid,micro_service.spring-boot-http,micro_service.spring-eureka,micro_service.mybatis-plus
spring:
  application:
    name: xfjr-statistics
  security:
    oauth2:
      resourceserver:
        jwt:
          # 本地校验 JWT 的公钥地址（FR-130）；生产由 Apollo 覆盖
          jwk-set-uri: http://localhost:53020/oauth2/jwks
